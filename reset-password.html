<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Clínica Estética ERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-spa"></i>
                    <h2>Recuperar Senha</h2>
                </div>
                <p class="subtitle">Digite seu e-mail para receber o link de recuperação</p>
            </div>
            
            <form id="resetForm" class="login-form">
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <button type="submit" class="btn-login">
                    <i class="fas fa-paper-plane"></i> Enviar Link
                </button>
            </form>
            
            <div class="login-footer">
                <a href="login.html">Voltar ao Login</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/update-password.html`
                });
                
                if (error) throw error;
                
                alert('Link de recuperação enviado! Verifique seu e-mail.');
                window.location.href = 'login.html';
            } catch (error) {
                alert('Erro ao enviar link: ' + error.message);
            }
        });
    </script>
</body>
</html>
