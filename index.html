<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinicalle - Redirecionando...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #0b132b; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; color: white; margin: 0;">
    <div style="text-align: center;">
        <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: #00b4d8; margin-bottom: 20px;"></i>
        <h3>Carregando Clinicalle...</h3>
    </div>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializar auth
            if (typeof auth !== 'undefined') {
                await auth.init();
                if (auth.isAuthenticated()) {
                    console.log('Autenticado, indo para o dashboard...');
                    window.location.href = 'dashboard.html';
                } else {
                    console.log('Não autenticado, indo para o login...');
                    window.location.href = 'login.html';
                }
            } else {
                console.log('Erro de módulo auth, indo para o login...');
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
