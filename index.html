<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Estética - Gestão Empresarial</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-spa"></i>
                <h1>ERP Estética</h1>
                <p>Sistema de Gestão Empresarial</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input type="email" id="email" name="email" required 
                           placeholder="seu@email.com" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <input type="password" id="password" name="password" required 
                           placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                
                <div class="login-options">
                    <a href="#" id="forgotPassword" class="forgot-link">
                        <i class="fas fa-key"></i> Esqueci minha senha
                    </a>
                </div>
                
                <div id="loginError" class="error-message" style="display: none;"></div>
            </form>
            
            <div id="resetPasswordForm" class="reset-form" style="display: none;">
                <h3>Recuperar Senha</h3>
                <p>Digite seu e-mail para receber o link de recuperação</p>
                
                <form id="resetForm">
                    <div class="form-group">
                        <input type="email" id="resetEmail" required 
                               placeholder="seu@email.com">
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="fas fa-paper-plane"></i> Enviar
                    </button>
                    
                    <button type="button" id="backToLogin" class="btn-secondary">
                        <i class="fas fa-arrow-left"></i> Voltar ao Login
                    </button>
                </form>
                
                <div id="resetMessage" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Sistema Principal -->
    <div id="appScreen" class="app-container" style="display: none;">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-spa"></i>
                <span>ERP Estética</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" data-page="dashboard" class="nav-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" data-page="clients" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Clientes</span>
                </a>
                <a href="#" data-page="products" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Produtos</span>
                </a>
                <a href="#" data-page="sales" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Vendas</span>
                </a>
                <a href="#" data-page="expenses" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Despesas</span>
                </a>
                <a href="#" data-page="users" class="nav-item admin-only">
                    <i class="fas fa-user-cog"></i>
                    <span>Usuários</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">Usuário</span>
                </div>
                <button id="logoutBtn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </aside>
        
        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="top-bar">
                <button id="menuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 id="pageTitle">Dashboard</h2>
                <div class="header-actions">
                    <div class="notification-bell">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                </div>
            </header>
            
            <!-- Páginas do Sistema -->
            <div class="content-area" id="contentArea">
                <!-- O conteúdo será carregado dinamicamente -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/clients.js"></script>
    <script src="js/products.js"></script>
    <script src="js/sales.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/users.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
