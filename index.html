<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - Loja</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .landing-container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 80px;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
        }

        p {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            margin-bottom: 40px;
        }

        .btn-login {
            background: white;
            color: #667eea;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="logo">
            <i class="fas fa-store"></i>
        </div>
        <h1>Sistema de Gestão da Loja</h1>
        <p>Controle de vendas, estoque e faturamento em um só lugar</p>
        <button class="btn-login" onclick="window.location.href='login.html'">
            <i class="fas fa-sign-in-alt"></i> Acessar Sistema
        </button>
    </div>
</body>
</html>
