<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinicalle - Usuários</title>
    <!-- Otimização de Carregamento (Preconnect) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <script>
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
    <div id="appScreen" class="app-container" style="display: flex;">
        <!-- Menu Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-magic"></i>
                    <span>Clinicalle</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="clientes.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Clientes</span>
                </a>
                <a href="produtos.html" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Produtos</span>
                </a>
                <a href="vendas.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Vendas</span>
                </a>
                <a href="despesas.html" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Despesas</span>
                </a>
                <a href="usuarios.html" class="nav-item active admin-only">
                    <i class="fas fa-user-cog"></i>
                    <span>Usuários</span>
                </a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Barra Superior -->
            <header class="top-bar">
                <button class="menu-toggle" id="menuToggleBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-info">
                    <h1 class="page-title" id="pageTitle">Usuários</h1>
                    <span class="current-date" id="currentDate">Carregando data...</span>
                </div>
                <div class="user-menu">
                    <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="user-profile">
                        <div class="avatar" id="userAvatar">U</div>
                        <div class="user-info">
                            <span class="user-name" id="userName">Carregando...</span>
                            <span class="user-role">Administrador</span>
                        </div>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="Sair do sistema">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Área de Conteúdo Específico -->
            <div class="content-area" id="contentArea">
                <div class="table-container">
                    <div class="table-header">
                        <h2>Gerenciamento de Usuários e Permissões</h2>
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>E-mail</th>
                                    <th>Papel / Perfil</th>
                                    <th>Data Cadastro</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <tr>
                                    <td colspan="5" class="text-center">
                                        <i class="fas fa-spinner fa-spin"></i> Carregando usuários...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/auth_check.js"></script>
    <script src="./js/usuarios.js"></script>
</body>
</html>
